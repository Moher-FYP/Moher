[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
# Polygon PoS (and Amoy) support Cancun opcodes since the Napoli hardfork.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
# H2 (slippage-elimination) is validated with 1,000 randomized mint/burn runs.
runs = 1000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
local = "http://127.0.0.1:8545"
amoy = "${AMOY_RPC_URL}"
