openapi: 3.1.0
info:
  title: MOHAR Partner Portal API
  version: 0.1.0-draft
  summary: Routes for the partner portal, where a partner's staff run their MOHAR integration.
  description: |
    The portal is for **people**, not servers. A partner's servers keep using the Partner API
    (`docs/openapi.yaml`) with an API key; the portal signs in a person and keeps a session.
    The two never mix: a session cannot call `/v1`, and an API key cannot call `/portal/v1`.

    ## Signing in
    Email, password and a one-time code from an authenticator app (RFC 6238, 30-second steps,
    6 digits). A code works once. A successful sign-in sets the `mohar_portal` cookie
    (`HttpOnly`, `SameSite=Strict`, `Secure` except on `http://localhost`). The session ends
    after 15 minutes without a request, after 8 hours whatever happens, or on sign-out.

    Wrong attempts slow down further attempts on that account: after 5 failures each try waits
    longer (1 second, doubling, up to 15 minutes) and the API answers `429` with `Retry-After`.
    After 20 failures in a row the account is disabled until an operator re-enables it.
    Attempts are also limited per IP address.

    ## Changes
    Every `POST`, `PUT` and `DELETE` must carry an `Origin` header that matches the portal's
    own address (`PORTAL_ORIGINS`). This, with `SameSite=Strict`, stops another site making a
    signed-in browser send a change.

    ## Roles and partners
    A user belongs to one partner and has one role: `viewer`, `developer`, `compliance`, or
    `operator` (MOHAR staff, no partner). The partner always comes from the session, never from
    the request: another partner's wallet or transaction answers `404`, as if it did not exist.

    | Role       | Can                                                    |
    |------------|--------------------------------------------------------|
    | viewer     | Read the overview, wallets, transactions and limits    |
    | developer  | Viewer, plus API keys and webhooks                     |
    | compliance | Viewer, plus the audit log, exports and freeze requests |
    | operator   | MOHAR's admin routes, for every partner                |

    ## Secrets
    A new API key or webhook secret is returned once, in the response that creates it, and
    never again. Keys are stored as SHA-256 hashes; webhook secrets sealed with
    `PORTAL_SECRET_KEY`, because MOHAR must sign with them.

    ## Freezes
    A partner's compliance user asks MOHAR to freeze or unfreeze one of its wallets; a MOHAR
    operator approves or rejects. Approval sends the transaction from MOHAR's compliance key,
    which can freeze and unfreeze and nothing else. Neither side can do it alone.

    ## Status
    Parts 1 and 2 of the portal build: sign-in, read routes, audit log, API keys, webhooks,
    freezes and the operator's partner list. The portal app follows in part 3.
  contact:
    name: MOHAR FYP team (FAST-NUCES)
servers:
  - url: http://localhost:4000
    description: Local development
security:
  - session: []
tags:
  - name: Session
  - name: Partner data
  - name: Compliance
  - name: Developers
  - name: Operators

paths:
  /portal/v1/session:
    post:
      tags: [Session]
      operationId: signIn
      summary: Sign in
      description: |
        Checks the password and the one-time code together and gives the same answer whichever
        was wrong, so the response does not reveal which part an attacker has right.
      security: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed in. Sets the `mohar_portal` cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Session]
      operationId: signOut
      summary: Sign out
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Signed out. Clears the cookie.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/v1/me:
    get:
      tags: [Session]
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: The user and when the session ends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /portal/v1/overview:
    get:
      tags: [Partner data]
      operationId: getOverview
      summary: Figures for the overview page
      description: Role `viewer` or above, partner users only.
      responses:
        "200":
          description: The partner's figures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/v1/wallets:
    get:
      tags: [Partner data]
      operationId: listPortalWallets
      summary: The partner's customer wallets
      description: Newest first. Role `viewer` or above.
      parameters:
        - name: q
          in: query
          description: Part of a customer reference, a wallet id or an address.
          schema:
            type: string
            maxLength: 128
        - name: kycLevel
          in: query
          schema:
            $ref: "#/components/schemas/KycLevel"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of wallets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalWalletList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/v1/wallets/{walletId}:
    get:
      tags: [Partner data]
      operationId: getPortalWallet
      summary: One wallet, its balance and how much of each KYC limit it has used
      parameters:
        - name: walletId
          in: path
          required: true
          schema:
            type: string
            pattern: "^wal_[A-Za-z0-9]+$"
      responses:
        "200":
          description: The wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalWalletDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /portal/v1/transactions:
    get:
      tags: [Partner data]
      operationId: listPortalTransactions
      summary: The partner's transactions
      description: Newest first. Role `viewer` or above.
      parameters:
        - name: walletId
          in: query
          schema:
            type: string
            pattern: "^wal_[A-Za-z0-9]+$"
        - name: type
          in: query
          schema:
            type: string
            enum: [mint, burn, transfer]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, submitted, confirmed, failed]
        - name: from
          in: query
          description: Created at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Created before this time.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of transactions
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/TransactionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/v1/transactions.csv:
    get:
      tags: [Compliance]
      operationId: exportTransactions
      summary: Export transactions as CSV
      description: |
        Role `compliance`. Takes the same filters as the list, at most 10,000 rows. Every
        export is written to the audit log.
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [mint, burn, transfer]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, submitted, confirmed, failed]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: CSV, one row per transaction
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/v1/transactions/{transactionId}:
    get:
      tags: [Partner data]
      operationId: getPortalTransaction
      summary: One transaction, with its quote
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            pattern: "^txn_[A-Za-z0-9]+$"
      responses:
        "200":
          description: The transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalTransactionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /portal/v1/limits:
    get:
      tags: [Partner data]
      operationId: getLimits
      summary: KYC limits per level and how many customers are at each
      responses:
        "200":
          description: The limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Limits"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/v1/audit:
    get:
      tags: [Compliance]
      operationId: listAudit
      summary: The partner's audit log
      description: |
        Role `compliance` (own partner) or `operator` (every partner). Newest first. Every
        change made in the portal, and every sign-in, refusal and export.
      parameters:
        - name: log
          in: query
          description: "`audit` (changes people made) or `security` (sign-ins and refusals)."
          schema:
            type: string
            enum: [audit, security]
            default: audit
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/v1/audit/verify:
    get:
      tags: [Compliance]
      operationId: verifyAudit
      summary: Check that neither log has been edited
      description: |
        Each entry stores the SHA-256 of the entry before it. Recomputes both chains and reports
        the first entry that does not match. Role `compliance` or `operator`.
      responses:
        "200":
          description: Result for each log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/v1/api-keys:
    get:
      tags: [Developers]
      operationId: listApiKeys
      summary: The partner's API keys
      description: |
        Role `developer`. Keys made in the portal, and the first characters of keys set in
        MOHAR's configuration (which only MOHAR can change). Never the keys themselves.
      responses:
        "200":
          description: The keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Developers]
      operationId: createApiKey
      summary: Create an API key
      description: Role `developer`. The key is in this response only. Store it now.
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [apiKey, key]
                properties:
                  apiKey:
                    $ref: "#/components/schemas/ApiKey"
                  key:
                    type: string
                    pattern: "^mk_test_[A-Za-z0-9_-]{43}$"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/v1/api-keys/{keyId}/revoke:
    post:
      tags: [Developers]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Role `developer`. The key is refused from the next request on.
      parameters:
        - $ref: "#/components/parameters/Origin"
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            pattern: "^key_[A-Za-z0-9]+$"
      responses:
        "204":
          description: Revoked (or already was)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /portal/v1/webhook:
    get:
      tags: [Developers]
      operationId: getWebhookSettings
      summary: The webhook URL and whether a secret is set
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Developers]
      operationId: setWebhookUrl
      summary: Change the webhook URL
      description: |
        Role `developer`. https only, no credentials in the URL, and the host must not be an
        internal address (loopback, private, link-local, unique-local, multicast, reserved).
        The addresses it resolves to are checked again on every delivery.
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/v1/webhook/rotate-secret:
    post:
      tags: [Developers]
      operationId: rotateWebhookSecret
      summary: Replace the webhook signing secret
      description: |
        Role `developer`. Events are signed with the new secret from now on. The secret is in
        this response only.
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: The new secret
          content:
            application/json:
              schema:
                type: object
                required: [secret, secretSetAt]
                properties:
                  secret:
                    type: string
                    pattern: "^whsec_"
                  secretSetAt:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/v1/webhook/deliveries:
    get:
      tags: [Developers]
      operationId: listWebhookDeliveries
      summary: Every webhook sent to the partner, newest first
      parameters:
        - name: transactionId
          in: query
          schema:
            type: string
            pattern: "^txn_[A-Za-z0-9]+$"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of deliveries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookDelivery"
                  nextCursor:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/v1/webhook/deliveries/{deliveryId}/resend:
    post:
      tags: [Developers]
      operationId: resendWebhook
      summary: Send an event again
      description: |
        Same event id and body, to the current URL, signed with the current secret. Answers
        after the first attempt or 2 seconds, whichever is first.
      parameters:
        - $ref: "#/components/parameters/Origin"
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            pattern: "^dlv_[A-Za-z0-9]+$"
      responses:
        "202":
          description: The new delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /portal/v1/wallets/{walletId}/freeze-requests:
    post:
      tags: [Compliance]
      operationId: requestFreeze
      summary: Ask MOHAR to freeze or unfreeze a wallet
      description: Role `compliance`. One open request per wallet.
      parameters:
        - $ref: "#/components/parameters/Origin"
        - name: walletId
          in: path
          required: true
          schema:
            type: string
            pattern: "^wal_[A-Za-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                action:
                  type: string
                  enum: [freeze, unfreeze]
                  default: freeze
                reason:
                  description: Kept by MOHAR off-chain. Never written to the chain.
                  type: string
                  minLength: 10
                  maxLength: 500
      responses:
        "201":
          description: Recorded, waiting for a MOHAR operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreezeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /portal/v1/freeze-requests:
    get:
      tags: [Compliance]
      operationId: listFreezeRequests
      summary: Freeze requests, newest first
      description: Role `compliance` (own partner) or `operator` (every partner).
      responses:
        "200":
          description: The requests
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FreezeRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/v1/admin/partners:
    get:
      tags: [Operators]
      operationId: listPartners
      summary: Every partner, its status on-chain and its customers
      description: Role `operator`.
      responses:
        "200":
          description: The partners
          content:
            application/json:
              schema:
                type: object
                required: [data, complianceKey]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [slug, partnerId, activeOnChain, customers]
                      properties:
                        slug:
                          type: string
                        partnerId:
                          type: string
                        activeOnChain:
                          type: boolean
                        customers:
                          type: integer
                        webhookUrl:
                          type: string
                  complianceKey:
                    description: The compliance key's address, or null if freezes cannot be carried out.
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /portal/v1/admin/freeze-requests/{requestId}/approve:
    post:
      tags: [Operators]
      operationId: approveFreeze
      summary: Carry out a freeze request on-chain
      description: |
        Role `operator`. Sends `freezeWallet` (or `unfreezeWallet`) from the compliance key and
        waits for it. The on-chain reason code is the hash of the request id: no reason text
        or personal data goes on-chain.
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreezeRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          description: No compliance key is configured. Code `not_implemented`.
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/Error"
        "502":
          description: The chain refused the transaction; the request is marked failed.
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/Error"

  /portal/v1/admin/freeze-requests/{requestId}/reject:
    post:
      tags: [Operators]
      operationId: rejectFreeze
      summary: Reject a freeze request
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreezeRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /portal/v1/admin/users:
    get:
      tags: [Operators]
      operationId: listUsers
      summary: Every portal user, with locked accounts visible
      description: Role `operator`. Never includes a password hash or authenticator secret.
      responses:
        "200":
          description: The users
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Operators]
      operationId: createUser
      summary: Add a portal user
      description: |
        Role `operator`. Generates the password and the authenticator key; both are in this
        response only. Operators have no partner; every other role needs one.
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: "#/components/schemas/Role"
                partner:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedSecrets"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /portal/v1/admin/users/{userId}/reset:
    post:
      tags: [Operators]
      operationId: resetUser
      summary: New password and authenticator key; ends the user's sessions
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The new secrets, once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedSecrets"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /portal/v1/admin/users/{userId}/enable:
    post:
      tags: [Operators]
      operationId: enableUser
      summary: Unlock an account and clear its failed attempts
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /portal/v1/admin/users/{userId}/disable:
    post:
      tags: [Operators]
      operationId: disableUser
      summary: Lock an account and end its sessions
      description: An operator cannot disable their own account.
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: mohar_portal
      description: Set by `POST /portal/v1/session`. Never an API key.

  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: Must be one of the portal's own origins (`PORTAL_ORIGINS`).
      schema:
        type: string
        example: http://localhost:3002
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        pattern: "^usr_[A-Za-z0-9]+$"
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        pattern: "^frz_[A-Za-z0-9]+$"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` of the previous page.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "./openapi.yaml#/components/schemas/Error"
    Unauthorized:
      description: Not signed in, the session has ended, or the sign-in details are wrong
      content:
        application/json:
          schema:
            $ref: "./openapi.yaml#/components/schemas/Error"
    Forbidden:
      description: |
        Signed in, but this role may not do this, the account is disabled, or the `Origin`
        header is missing or not the portal's. Code `forbidden`.
      content:
        application/json:
          schema:
            $ref: "./openapi.yaml#/components/schemas/Error"
    NotFound:
      description: Not found, or it belongs to another partner
      content:
        application/json:
          schema:
            $ref: "./openapi.yaml#/components/schemas/Error"
    Conflict:
      description: Not possible in the current state (already decided, already open)
      content:
        application/json:
          schema:
            $ref: "./openapi.yaml#/components/schemas/Error"
    TooManyRequests:
      description: Too many attempts. Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "./openapi.yaml#/components/schemas/Error"

  schemas:
    Role:
      type: string
      enum: [viewer, developer, compliance, operator]

    KycLevel:
      type: string
      enum: [asaan, standard, enhanced]

    SignInRequest:
      type: object
      required: [email, password, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
        code:
          type: string
          pattern: "^[0-9]{6}$"

    Me:
      type: object
      required: [user, sessionExpiresAt, idleTimeoutSeconds]
      properties:
        user:
          $ref: "#/components/schemas/PortalUser"
        sessionExpiresAt:
          description: The absolute end of the session (8 hours after sign-in).
          type: string
          format: date-time
        idleTimeoutSeconds:
          type: integer
          example: 900

    PortalUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          pattern: "^usr_[A-Za-z0-9]+$"
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        partner:
          description: The partner's slug. Absent for operators.
          type: string

    Overview:
      type: object
      required:
        [
          partner,
          customers,
          goldHeldGrams,
          goldHeldPkr,
          volume30DaysPkr,
          failedLast7Days,
          latestTransactions,
        ]
      properties:
        partner:
          type: string
        customers:
          type: integer
        goldHeldGrams:
          $ref: "./openapi.yaml#/components/schemas/Grams"
        goldHeldPkr:
          $ref: "./openapi.yaml#/components/schemas/Pkr"
        volume30DaysPkr:
          description: Confirmed mints and burns in the last 30 days, at the price they traded.
          $ref: "./openapi.yaml#/components/schemas/Pkr"
        failedLast7Days:
          type: integer
        reserve:
          description: The latest proof of reserve. Absent until one is published.
          type: object
          required: [fullyBacked, asOf]
          properties:
            fullyBacked:
              type: boolean
            asOf:
              type: string
              format: date-time
        latestTransactions:
          type: array
          maxItems: 10
          items:
            $ref: "./openapi.yaml#/components/schemas/Transaction"

    PortalWallet:
      type: object
      required: [id, externalCustomerId, address, kycLevel, createdAt]
      properties:
        id:
          type: string
        externalCustomerId:
          type: string
        address:
          $ref: "./openapi.yaml#/components/schemas/Address"
        kycLevel:
          $ref: "#/components/schemas/KycLevel"
        createdAt:
          type: string
          format: date-time

    PortalWalletList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PortalWallet"
        nextCursor:
          type: string

    LimitUse:
      type: object
      required: [limitPkr, usedPkr]
      properties:
        limitPkr:
          $ref: "./openapi.yaml#/components/schemas/Pkr"
        usedPkr:
          $ref: "./openapi.yaml#/components/schemas/Pkr"

    PortalWalletDetail:
      allOf:
        - $ref: "#/components/schemas/PortalWallet"
        - type: object
          required: [status, balanceGrams, valuePkr, limits]
          properties:
            status:
              type: string
              enum: [active, frozen]
            balanceGrams:
              $ref: "./openapi.yaml#/components/schemas/Grams"
            valuePkr:
              $ref: "./openapi.yaml#/components/schemas/Pkr"
            explorerUrl:
              type: string
              format: uri
            limits:
              type: object
              required: [perTradePkr, last24Hours, last30Days, holding]
              properties:
                perTradePkr:
                  $ref: "./openapi.yaml#/components/schemas/Pkr"
                last24Hours:
                  $ref: "#/components/schemas/LimitUse"
                last30Days:
                  $ref: "#/components/schemas/LimitUse"
                holding:
                  $ref: "#/components/schemas/LimitUse"

    PortalTransactionDetail:
      type: object
      required: [transaction]
      properties:
        transaction:
          $ref: "./openapi.yaml#/components/schemas/Transaction"
        quote:
          description: The quote a mint or burn executed. Absent for transfers.
          $ref: "./openapi.yaml#/components/schemas/Quote"
        failureMessage:
          type: string

    Limits:
      type: object
      required: [levels]
      properties:
        levels:
          type: array
          items:
            type: object
            required: [level, perTradePkr, per24HoursPkr, per30DaysPkr, maxHoldingPkr, customers]
            properties:
              level:
                $ref: "#/components/schemas/KycLevel"
              perTradePkr:
                $ref: "./openapi.yaml#/components/schemas/Pkr"
              per24HoursPkr:
                $ref: "./openapi.yaml#/components/schemas/Pkr"
              per30DaysPkr:
                $ref: "./openapi.yaml#/components/schemas/Pkr"
              maxHoldingPkr:
                $ref: "./openapi.yaml#/components/schemas/Pkr"
              customers:
                type: integer

    AuditEntry:
      type: object
      required: [seq, at, action, result, hash, prevHash]
      properties:
        seq:
          type: integer
        at:
          type: string
          format: date-time
        userId:
          type: string
        email:
          type: string
        partner:
          type: string
        action:
          type: string
          example: session.created
        target:
          type: string
        result:
          type: string
          enum: [ok, refused, failed]
        detail:
          type: object
          additionalProperties: true
        ip:
          type: string
        hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        prevHash:
          type: string
          pattern: "^[a-f0-9]{64}$"

    AuditList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextCursor:
          type: string

    AuditVerification:
      type: object
      required: [audit, security]
      properties:
        audit:
          $ref: "#/components/schemas/ChainCheck"
        security:
          $ref: "#/components/schemas/ChainCheck"

    ChainCheck:
      type: object
      required: [intact, entries]
      properties:
        intact:
          type: boolean
        entries:
          type: integer
        firstBrokenSeq:
          type: integer

    ApiKey:
      type: object
      required: [id, name, prefix, createdAt, status]
      properties:
        id:
          type: string
          pattern: "^key_[A-Za-z0-9]+$"
        name:
          type: string
        prefix:
          description: The first 12 characters, for recognising the key.
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, revoked]

    ApiKeyList:
      type: object
      required: [data, configured]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
        configured:
          description: Keys set in MOHAR's configuration, by their first 12 characters.
          type: array
          items:
            type: object
            required: [prefix]
            properties:
              prefix:
                type: string

    WebhookSettings:
      type: object
      required: [secretSet, localhostAllowed]
      properties:
        url:
          type: string
        secretSet:
          type: boolean
        secretSetAt:
          type: string
          format: date-time
        localhostAllowed:
          description: True only for the local demo (WEBHOOK_ALLOW_LOCALHOST).
          type: boolean

    WebhookDelivery:
      type: object
      required: [id, eventId, transactionId, event, url, status, attempts, createdAt]
      properties:
        id:
          type: string
          pattern: "^dlv_[A-Za-z0-9]+$"
        eventId:
          type: string
          pattern: "^evt_[A-Za-z0-9]+$"
        transactionId:
          type: string
        event:
          type: string
          enum: [transaction.confirmed, transaction.failed]
        url:
          type: string
        status:
          type: string
          enum: [pending, delivered, failed]
        attempts:
          type: array
          items:
            type: object
            required: [at, ms]
            properties:
              at:
                type: string
                format: date-time
              statusCode:
                type: integer
              error:
                type: string
              ms:
                type: integer
        createdAt:
          type: string
          format: date-time
        nextAttemptAt:
          description: |
            While pending after a failed attempt, when MOHAR tries again. Retries follow a
            schedule from the first attempt (1 min, 5 min, 30 min, 2 h, 6 h, 12 h, 1, 2 and 3
            days, each up to 20% early or late), survive a restart, and stop at 3 days.
          type: string
          format: date-time
        resendOf:
          type: string

    FreezeRequest:
      type: object
      required: [id, partnerSlug, walletId, action, reason, requestedBy, requestedAt, status]
      properties:
        id:
          type: string
          pattern: "^frz_[A-Za-z0-9]+$"
        partnerSlug:
          type: string
        walletId:
          type: string
        action:
          type: string
          enum: [freeze, unfreeze]
        reason:
          type: string
        requestedBy:
          type: string
        requestedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, done, rejected, failed]
        decidedBy:
          type: string
        decidedAt:
          type: string
          format: date-time
        txHash:
          type: string
        failure:
          type: string

    ManagedUser:
      type: object
      required: [id, email, role, status, failedAttempts, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        partner:
          type: string
        status:
          type: string
          enum: [active, disabled]
        failedAttempts:
          description: Wrong sign-ins in a row. From 5 each try waits longer; at 20 the account is disabled.
          type: integer
        lastFailedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    IssuedSecrets:
      type: object
      required: [user, password, setupKey, otpauthUri]
      properties:
        user:
          $ref: "#/components/schemas/ManagedUser"
        password:
          type: string
        setupKey:
          description: The authenticator secret in base32, for apps that cannot scan.
          type: string
        otpauthUri:
          description: The same secret as an otpauth:// link, which the portal shows as a QR code.
          type: string
